services:
  outlook:
    build: ./servers/outlook
    ports:
      - "8000:8000"
    environment:
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
      - SERVER_URL=${SERVER_URL:-http://localhost:8000}
      - PORT=8000
    restart: unless-stopped
