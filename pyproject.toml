[project]
name = "mcp-servers"
version = "0.1.0"
description = "Remote MCP servers for Microsoft 365 via Microsoft Graph"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "msgraph-beta-sdk>=1.0.0",
    "azure-identity>=1.19.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
mcp-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "outlook/"]
