[project]
name = "outlook-mcp"
version = "0.1.0"
description = "MCP server for Outlook email and calendar via Microsoft Graph"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "msgraph-beta-sdk>=1.0.0",
    "azure-core>=1.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
outlook-mcp = "outlook_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_mcp"]
